<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8b845c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Waqt">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Waqt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800;900&display=swap">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="../login.css">
</head>
<body data-phase="dhuhr">
  <header class="top">
    <div class="tl">
      <button id="account-btn" class="circle" type="button" aria-label="Аккаунт" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7z" fill="currentColor"/></svg>
      </button>
      <button id="push-btn" class="circle" type="button" aria-label="Уведомления" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.500L4 16v1h16v-1l-2-3.500V9a6 6 0 0 0-6-6z" fill="currentColor"/><path d="M10 19a2 2 0 0 0 4 0z" fill="currentColor"/></svg>
      </button>
      <button id="lang-btn" class="circle text" type="button" aria-label="Язык · Тіл · اللغة">RU</button>
    </div>
    <div class="tr">
      <div class="city"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M21 3L3 10.500l7.500 2.500L13 21z" fill="currentColor"/></svg><span id="city"></span></div>
      <div id="now-date" class="date"></div>
    </div>
  </header>

  <main class="stack">
    <section class="panel" id="now-card" aria-live="polite">
      <ul id="rows" class="rows"></ul>
      <div class="strip level-normal" id="strip">
        <div class="strip-l"><span id="strip-name" class="strip-name">…</span><span id="strip-sub" class="strip-sub"></span></div>
        <div class="strip-time"><span id="timer" class="timer">--:--</span><span id="seconds" class="seconds"></span></div>
      </div>
      <div class="bar-track"><i id="bar"></i></div>
    </section>

    <button id="mark-btn" class="markpill" type="button" hidden></button>

    <div class="pair">
      <section class="glass" id="streak-card">
        <div class="k" data-i18n="app.streakTitle"></div>
        <div class="big"><span id="streak-n">0</span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12.500 2.500c.4 3-1.300 4.600-2.800 6.300C8.200 10.500 7 12.200 7 14.500a5 5 0 0 0 10 0c0-2.300-1-3.800-2.200-5.200-.4 1.400-1.100 2.200-2 2.500.6-3.300.4-6.500-.3-9.300z" fill="currentColor"/></svg></div>
        <div id="streak-label" class="sub"></div>
        <div class="day-progress"><i id="day-bar"></i></div>
        <div id="day-count" class="sub"></div>
      </section>
      <section class="glass names" id="name-card" hidden>
        <div class="k" data-i18n="app.name"></div>
        <div id="name-ar" class="name-ar"></div>
        <div id="name-tr" class="name-tr"></div>
        <div id="name-tl" class="sub"></div>
      </section>
    </div>

    <section class="glass">
      <h2 data-i18n="app.history"></h2>
      <div class="hist-wrap">
        <div id="hist-names" class="hist-names"></div>
        <div class="hist-scroll"><div id="hist" class="hist"></div></div>
      </div>
      <div class="legend">
        <span class="lg on_time" data-i18n="lg.on_time"></span>
        <span class="lg late" data-i18n="lg.late"></span>
        <span class="lg missed" data-i18n="lg.missed"></span>
        <span class="lg nodata" data-i18n="lg.nodata"></span>
      </div>
      <p class="hint" data-i18n="h.hint"></p>
    </section>
  </main>

  <footer class="foot"><a href="../" data-i18n="app.about"></a></footer>
  <audio id="chime" src="chime.wav" preload="auto"></audio>
  <script src="../no-zoom.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
