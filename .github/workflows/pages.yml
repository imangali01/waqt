name: pages

# Публикация лендинга и веб-версии (site/) на GitHub Pages.
# Один раз включить: репозиторий → Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'src/core/**', 'src/web/**', 'assets/**', 'scripts/build-site.js', 'scripts/png.js', 'scripts/icon.js']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
